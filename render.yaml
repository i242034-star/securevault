services:
  - type: web
    name: securevault-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      # Production mode turns on the startup check that refuses dev-default secrets
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      # Set this to your real Vercel URL after the frontend is deployed
      - key: CORS_ALLOWED_ORIGINS
        value: "https://securevault.vercel.app,http://localhost:5173"
      # Strong random secrets generated by Render (never committed to git)
      - key: JWT_SECRET
        generateValue: true
      - key: AUDIT_HMAC_SECRET
        generateValue: true
      - key: MASTER_KEY_PASSPHRASE
        generateValue: true
      # Re-create demo personas + sample document whenever the disk is empty
      # (Render free instances have an ephemeral filesystem)
      - key: SEED_DEMO_DATA
        value: "true"
